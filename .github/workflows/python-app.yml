name: Python application

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "archive/**"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.mp3"
      - "**/*.wav"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "archive/**"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.mp3"
      - "**/*.wav"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with flake8
        run: >
          uv run flake8
          simulation_11
          tests
          simulasyon_11.py
          __main__.py
          levhi_mahfuz.py
          dashboard_11.py

      - name: Lint with ruff
        run: >
          uv run ruff check
          simulation_11
          tests
          simulasyon_11.py
          __main__.py
          levhi_mahfuz.py
          dashboard_11.py

      - name: Test with pytest
        run: uv run pytest tests/ -m "not slow" --tb=short