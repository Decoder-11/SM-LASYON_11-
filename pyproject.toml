[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s-m-lasyon-11"
version = "2.0.0"
description = "11-Dimensional Universe Simulation System"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "flask>=2.3.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
]

[project.scripts]
simulation-11 = "simulation_11.cli:main"
dashboard-11 = "dashboard_11.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "flake8>=7.0",
    "scipy-stubs~=1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["simulation_11", "dashboard_11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: full orchestrator run_all()",
    "network: NASA/API/Gemini calls",
    "legacy: not yet migrated",
]

[tool.flake8]
max-line-length = 127

[tool.ruff]
target-version = "py311"
line-length = 127
respect-gitignore = true

[tool.ruff.lint.per-file-ignores]
"archive/**" = ["E", "F"]